<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chat UI Demo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #d6dae1;
      --accent: #1b6b54;
      --accent-2: #2457a6;
      --danger: #a63838;
      --shadow: 0 12px 36px rgba(31, 42, 55, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
    }

    aside {
      border-right: 1px solid var(--line);
      background: #edf0f4;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font-size: 20px;
      line-height: 1.25;
      margin: 0;
      font-weight: 700;
    }

    .status-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 10px;
      background: var(--panel);
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
    }

    .metric {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      font-size: 14px;
      padding: 8px 0;
      border-bottom: 1px solid #edf0f4;
    }

    .metric:last-child {
      border-bottom: 0;
    }

    .metric span {
      color: var(--muted);
    }

    .metric strong {
      font-weight: 700;
    }

    .topbar {
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      min-height: 36px;
      padding: 0 12px;
      font: inherit;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    button.danger {
      color: var(--danger);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .messages {
      overflow: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: min(760px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .message.user {
      align-self: flex-end;
      background: #eaf3ff;
      border-color: #bfd4f2;
      box-shadow: none;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .message-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .message-content {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 15px;
    }

    .citations {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .citation {
      border: 1px solid #c9d8ef;
      background: #f3f7ff;
      color: var(--accent-2);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
    }

    .composer {
      border-top: 1px solid var(--line);
      background: var(--panel);
      padding: 16px 22px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
    }

    textarea {
      width: 100%;
      min-height: 48px;
      max-height: 160px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      font: inherit;
      line-height: 1.45;
      color: var(--text);
    }

    .empty {
      margin: auto;
      max-width: 560px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        display: none;
      }

      main {
        height: 100vh;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .composer {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <h1>AI Chat UI</h1>
        <span id="statusPill" class="status-pill">Ready</span>
      </div>
      <div class="panel">
        <div class="metric"><span>Messages</span><strong id="messageCount">0</strong></div>
        <div class="metric"><span>Mode</span><strong id="modeText">SSE</strong></div>
        <div class="metric"><span>Trace</span><strong id="traceText">-</strong></div>
      </div>
      <div class="panel">
        <div class="metric"><span>Send</span><strong id="sendState">on</strong></div>
        <div class="metric"><span>Cancel</span><strong id="cancelState">off</strong></div>
        <div class="metric"><span>Retry</span><strong id="retryState">off</strong></div>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h2>Streaming Assistant Prototype</h2>
        </div>
        <div class="toolbar">
          <button id="seedButton" type="button">Sample</button>
          <button id="retryButton" type="button">Retry</button>
          <button id="cancelButton" class="danger" type="button">Cancel</button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <div class="empty">No messages yet.</div>
      </section>

      <form id="composer" class="composer">
        <textarea id="input" placeholder="Ask a question"></textarea>
        <button id="sendButton" class="primary" type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="./chat_ui_state.cjs"></script>
  <script>
    const api = window.chatUiState || module.exports;
    let state = api.createInitialState();
    let timer = null;

    const chunks = [
      "前端要把模型响应拆成稳定状态：waiting、streaming、completed、cancelled、error。\n",
      "流式输出期间，Send 应禁用，Cancel 应启用，消息内容按 delta 追加。\n",
      "如果答案来自 RAG，引用应该作为结构化数据展示，而不是混在普通文本里。"
    ];

    const citations = [
      { label: "[streaming-ux#0]", title: "Streaming UX" },
      { label: "[rag-citation#0]", title: "RAG Citation" }
    ];

    document.getElementById("composer").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = document.getElementById("input");
      send(input.value);
      input.value = "";
    });

    document.getElementById("seedButton").addEventListener("click", () => {
      document.getElementById("input").value = "Android 端 AI 聊天如何处理流式输出和引用？";
    });

    document.getElementById("cancelButton").addEventListener("click", () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
      state = api.cancelAssistantMessage(state);
      render();
    });

    document.getElementById("retryButton").addEventListener("click", () => {
      state = api.retryLastAssistant(state);
      const pending = state.pendingInput;
      render();
      send(pending, true);
    });

    function send(value, fromRetry = false) {
      if (!fromRetry) {
        state = api.submitUserMessage(state, value);
      }
      const traceId = "trace-" + Date.now().toString(36);
      state = api.startAssistantMessage(state, traceId);
      render();

      let index = 0;
      timer = setInterval(() => {
        state = api.appendAssistantDelta(state, chunks[index]);
        index += 1;
        if (index >= chunks.length) {
          clearInterval(timer);
          timer = null;
          state = api.receiveCompleted(state, citations);
        }
        render();
      }, 520);
    }

    function render() {
      const ui = api.buildUiModel(state);
      document.getElementById("statusPill").textContent = ui.statusLabel;
      document.getElementById("messageCount").textContent = String(ui.messageCount);
      document.getElementById("traceText").textContent = state.activeTraceId || "-";
      document.getElementById("sendState").textContent = ui.canSend ? "on" : "off";
      document.getElementById("cancelState").textContent = ui.canCancel ? "on" : "off";
      document.getElementById("retryState").textContent = ui.canRetry ? "on" : "off";
      document.getElementById("sendButton").disabled = !ui.canSend;
      document.getElementById("cancelButton").disabled = !ui.canCancel;
      document.getElementById("retryButton").disabled = !ui.canRetry;

      const list = document.getElementById("messages");
      if (!state.messages.length) {
        list.innerHTML = '<div class="empty">No messages yet.</div>';
        return;
      }
      list.innerHTML = state.messages.map(renderMessage).join("");
      list.scrollTop = list.scrollHeight;
    }

    function renderMessage(message) {
      const citationsHtml = (message.citations || []).map((citation) => {
        return `<span class="citation">${escapeHtml(api.formatCitation(citation))}</span>`;
      }).join("");
      return `
        <article class="message ${message.role}">
          <div class="message-head">
            <span>${message.role === "user" ? "You" : "Assistant"}</span>
            <span>${message.status}</span>
          </div>
          <div class="message-content">${escapeHtml(message.content || "")}</div>
          ${citationsHtml ? `<div class="citations">${citationsHtml}</div>` : ""}
        </article>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    render();
  </script>
</body>
</html>
